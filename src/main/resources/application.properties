# Neo4J Connector

spring.neo4j.uri=${NEO_URL:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO_USER:neo4j}
spring.neo4j.authentication.password=${NEO_PASSWORD:rootroot}

logging.level.org.springframework.data.neo4j=DEBUG

# PostgreSQL Connector
spring.datasource.url=jdbc:postgresql://localhost:5432/epers_unidad4
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# DDL generation
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# Configuracion de Hibernate para usar archivos XML
spring.jpa.mapping-resources=hibernate/Personaje.hbm.xml,hibernate/Item.hbm.xml
